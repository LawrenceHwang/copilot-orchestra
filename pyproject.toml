[project]
name = "copilot-orchestra"
version = "0.1.0"
description = "Multi-agent AI code review platform built on the GitHub Copilot SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "github-copilot-sdk>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "aiofiles>=25.1.0",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: marks tests that require a running Copilot CLI (deselect with -m 'not integration')",
]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = [
    "S101", # assert in tests
    "S603", # subprocess without shell — we validate paths separately
    "B008", # FastAPI Depends() in function signature
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "src/backend/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
